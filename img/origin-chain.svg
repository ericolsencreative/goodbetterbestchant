<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">How the Good, Better, Best chant reached the Chicago Bears</title>
<desc id="d">A chain of six steps: a 19th-century proverb, to Richard Bell at an FCA camp in the early 1990s, to Bobby Poss, to the A.C. Reynolds Rockets from 1994, to quarterback Ben Johnson, to the Chicago Bears in 2025.</desc>
<style>.b{fill:#0B162A}.o{fill:#C83803}.w{fill:#fff;font-family:'Alfa Slab One',Impact,sans-serif;font-size:22px;text-anchor:middle}.s{fill:#c9d0dd;font-family:system-ui,sans-serif;font-size:15px;text-anchor:middle}.a{stroke:#C83803;stroke-width:5;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C83803"/></marker></defs>
<g>
<rect class="b" x="20" y="130" width="170" height="160" rx="10"/><text class="w" x="105" y="195">A PROVERB</text><text class="s" x="105" y="225">English schoolroom rhyme</text><text class="s" x="105" y="247">in print by 1897</text>
<rect class="b" x="222" y="130" width="170" height="160" rx="10"/><text class="w" x="307" y="195">RICHARD BELL</text><text class="s" x="307" y="225">FCA camp speaker</text><text class="s" x="307" y="247">early 1990s</text>
<rect class="b" x="424" y="130" width="170" height="160" rx="10"/><text class="w" x="509" y="195">BOBBY POSS</text><text class="s" x="509" y="225">camp dean, then</text><text class="s" x="509" y="247">Reynolds head coach</text>
<rect class="b" x="626" y="130" width="170" height="160" rx="10"/><text class="w" x="711" y="185">A.C. REYNOLDS</text><text class="w" x="711" y="212">ROCKETS</text><text class="s" x="711" y="247">Asheville, NC · from 1994</text>
<rect class="b" x="828" y="130" width="170" height="160" rx="10"/><text class="w" x="913" y="195">BEN JOHNSON</text><text class="s" x="913" y="225">water boy, then QB</text><text class="s" x="913" y="247">2002 state champion</text>
<rect class="o" x="1030" y="130" width="150" height="160" rx="10"/><text class="w" x="1105" y="195">THE BEARS</text><text class="s" x="1105" y="225" fill="#fff">locker room</text><text class="s" x="1105" y="247" fill="#fff">Aug 17, 2025 →</text>
<path class="a" d="M190,210 L216,210"/><path class="a" d="M392,210 L418,210"/><path class="a" d="M594,210 L620,210"/><path class="a" d="M796,210 L822,210"/><path class="a" d="M998,210 L1024,210"/>
</g>
<text class="s" x="600" y="60" style="font-size:20px;fill:#5b6475">One chant, six hand-offs, about 130 years</text>
<text class="s" x="600" y="360" style="fill:#5b6475">Sources: ESPN, ABC7 Chicago, Greensboro Sports, Fauxtations · goodbetterbestchant.com/origin</text>
</svg>
